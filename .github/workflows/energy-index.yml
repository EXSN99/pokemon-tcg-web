name: Actualizar índice de energías TCGdex

on:
  push:
    paths:
      - 'scripts/build_energy_index.py'
      - '.github/workflows/energy-index.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Máximo de cartas nuevas por ejecución (1 a 5000)'
        required: false
        default: '1200'
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: tcgdex-energy-index-main
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar librería de red
        run: python -m pip install 'requests>=2.32,<3'
      - name: Actualizar índice incremental
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '1200' }}
        run: |
          python scripts/build_energy_index.py --batch-size "$BATCH_SIZE" --workers 4
          python -c "import json; i=json.load(open('data/energy-index.json', encoding='utf-8')); print('Cobertura:', i['indexedCount'], '/', i['catalogSize'], 'completo:', i['complete'])"
      - name: Guardar datos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/energy-index.json
          if git diff --cached --quiet; then
            echo 'Sin cambios en el índice'
          else
            git commit -m "data: actualizar índice de energías TCGdex [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
